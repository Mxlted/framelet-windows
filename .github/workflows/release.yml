name: Draft preview release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build and test
        run: |
          ./scripts/build.ps1
          ./scripts/test.ps1
      - name: Package tagged version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/package.ps1 -Version $env:RELEASE_TAG.TrimStart('v') -SkipTests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Framelet-release
          path: artifacts/releases/*
          if-no-files-found: error
      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view $env:RELEASE_TAG --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'A release already exists. Its published assets are left unchanged; this build is attached to the workflow.'
            exit 0
          }
          $assets = @(Get-ChildItem artifacts/releases -File | ForEach-Object FullName)
          gh release create $env:RELEASE_TAG @assets --verify-tag --draft --prerelease --title "Framelet $env:RELEASE_TAG" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
